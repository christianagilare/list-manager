spring:
  application:
    name: listmanager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/listmanager}
    username: ${SPRING_DATASOURCE_USERNAME:listmanager}
    password: ${SPRING_DATASOURCE_PASSWORD:listmanager}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

supabase:

  # JWT Signing Keys (ES256): obligatorio para tokens de sesión de Supabase Auth. Por defecto este proyecto.


